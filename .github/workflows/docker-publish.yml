name: Publish Docker image to GHCR

on:
  release:
    types: [ published ]

jobs:
  build-and-push:
    if: github.event.release.target_commitish == 'main' || github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine build version
        id: vars
        env:
          RELEASE_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          CHANNEL="main"
          if [[ "${RELEASE_BRANCH}" == "dev" ]]; then
            CHANNEL="dev"
          fi
          IMAGE="ghcr.io/${{ github.repository }}"
          PRIMARY_TAG="latest"
          if [[ "${CHANNEL}" == "dev" ]]; then
            PRIMARY_TAG="dev_latest"
          fi
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "image=$IMAGE"
            echo "primary_tag=$PRIMARY_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (NO CACHE)
        run: |
            docker build \
            --no-cache \
            --build-arg APP_VERSION=${{ steps.vars.outputs.version }} \
            --build-arg APP_REPO=${{ github.repository }} \
            --build-arg APP_CHANNEL=${{ steps.vars.outputs.channel }} \
            -t ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.primary_tag }} \
            .


      - name: Push Docker image (primary tag)
        run: |
          docker push ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.primary_tag }}

      - name: Tag image with release version
        if: startsWith(github.ref, 'refs/tags/') && github.event.release.target_commitish == 'main'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.primary_tag }} ${{ steps.vars.outputs.image }}:$VERSION
          docker push ${{ steps.vars.outputs.image }}:$VERSION

      - name: Tag dev image with release version
        if: startsWith(github.ref, 'refs/tags/') && github.event.release.target_commitish == 'dev'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.primary_tag }} ${{ steps.vars.outputs.image }}:dev_${VERSION}
          docker push ${{ steps.vars.outputs.image }}:dev_${VERSION}
