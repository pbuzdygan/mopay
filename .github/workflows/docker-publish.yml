#Below action to build image on release - from GIthub GUI
on:
  release:
    types: [ published ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (NO CACHE)
        run: |
            docker build \
            --no-cache \
            -t ghcr.io/${{ github.repository }}:latest \
            .


      - name: Push Docker image (latest)
        run: |
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Tag image with release version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "Tagging image as $VERSION"
          docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:$VERSION
          docker push ghcr.io/${{ github.repository }}:$VERSION
