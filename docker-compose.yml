version: '3.8'
services:
  backend:
    build: ./backend
    image: mopay-backend:na
    environment:
      - MOPAY_DB=/app/data/mopay.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: mopay-frontend:na
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped
