services:
  app:
    build: .
    container_name: mopay_dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
#      - PORT=8010
      - DB_FILE=/data/mopay.sqlite
      # Optional read-only sample data in /data/mopay.demo.sqlite:
      # - APP_DEMO=true
      # Optional storage owner (defaults to 1000:1000):
      # - PUID=1000
      # - PGID=1000
      - APP_PIN=123456
      - APP_ENC_KEY=YOUR_ENC_KEY_HERE
      - NODE_ENV=production
    volumes:
      - ./data:/data
    ports:
      - "9010:8010"
