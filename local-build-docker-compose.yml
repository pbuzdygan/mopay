services:
  app:
    build: .
    container_name: mopay_dev
    restart: unless-stopped
    environment:
#      - PORT=8010
      - DB_FILE=/data/mopay.sqlite
      - APP_PIN=123456
      - APP_ENC_KEY=YOUR_ENC_KEY_HERE
      - NODE_ENV=production
    volumes:
      - ./data:/data
    ports:
      - "9010:8010"
